name: signature-approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: signature-approval-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  signature-approval:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: windows-latest
    steps:
    # Execute only default-branch tooling. PR blobs are parsed as data, never
    # checked out, imported, or executed with the write-capable token.
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/github-script@v8
      with:
        script: |
          const gate = require('./build/signature-approval.cjs');
          await gate.run({ github, context, core });
