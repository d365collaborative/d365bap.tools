name: test-validation-runners

# This conditional workflow exercises validation infrastructure changes.
# Keep it out of required-check rules: unrelated PRs do not trigger it.
on:
  pull_request:
    paths:
      - '.github/workflows/test-validation-runners.yml'
      - 'build/Test-PesterRunners.ps1'
      - 'build/Test-PSScriptAnalyzerConsolidation.ps1'
      - 'build/Test-RequiredModules.ps1'
      - 'build/Test-Ps1ExampleHelp.ps1'
      - 'build/Test-Ps1WildcardRule.ps1'
      - 'build/Test-Ps1EmptyAttributeRule.ps1'
      - 'build/Test-Ps1MandatoryRule.ps1'
      - 'build/Test-Ps1ParameterArgumentRule.ps1'
      - 'build/Test-Ps1ParameterPositionRule.ps1'
      - 'build/Test-Ps1StandardOutputRule.ps1'
      - 'build/Test-Ps1ParameterLayoutRule.ps1'
      - 'build/Test-Ps1AddMemberRule.ps1'
      - 'build/Test-Ps1AccessTokenRule.ps1'
      - 'build/Test-Ps1CommentRule.ps1'
      - 'build/Test-Ps1EnvironmentLookupRule.ps1'
      - 'build/Test-Ps1VariableNamingRule.ps1'
      - 'build/Test-Ps1ShouldProcessRule.ps1'
      - 'build/Test-Ps1OutputTypeRule.ps1'
      - 'build/Test-Ps1FunctionInterruptRule.ps1'
      - 'build/Test-Ps1ReturnValueRule.ps1'
      - 'build/Test-Ps1ObjectArrayCastRule.ps1'
      - 'build/Test-Ps1ValidationAttributeOnMandatoryRule.ps1'
      - 'build/Test-Ps1WildcardParameterAsFilterRule.ps1'
      - 'build/Test-Ps1OrderedPSCustomObjectRule.ps1'
      - 'build/Test-Ps1OutNullRule.ps1'
      - 'build/Test-Ps1StandardExcelExportRule.ps1'
      - 'build/Test-Ps1LoopAppendRule.ps1'
      - 'build/Test-Ps1NullComparisonRule.ps1'
      - 'build/Test-Ps1DirectParameterCheckRule.ps1'
      - 'build/Test-Ps1PipelineContinuationRule.ps1'
      - 'build/Test-Ps1OneParameterPerLineRule.ps1'
      - 'build/Test-Ps1CentralApiVersionRule.ps1'
      - 'build/Test-Ps1FormattedUrlRule.ps1'
      - 'build/Test-PreloadExitCode.ps1'
      - 'build/Test-ModulePublication.ps1'
      - 'build/Publish-ModuleWithRetry.ps1'
      - 'build/vsts-build.ps1'
      - 'build/build-notifications.cjs'
      - 'build/build-notifications.test.cjs'
      - '.github/workflows/build-notifications.yml'
      - '.github/workflows/build-v2.yml'
      - 'd365bap.tools/internal/sdk/token-preload.ps1'
      - 'd365bap.tools/internal/sdk/finopsversion-preload.ps1'
      - 'build/ps1-lint/**'
      - 'build/Install-RequiredModules.ps1'
      - 'build/ModuleCacheRequirements.json'
      - 'd365bap.tools/tests/pester.ps1'
      - 'd365bap.tools/tests/pester-PSScriptAnalyzer.ps1'
      - 'd365bap.tools/tests/general/PSScriptAnalyzer.Tests.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  regression:
    name: Validation runner regression tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Test optional import probes
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-PreloadExitCode.ps1
    - name: Test build notifications
      run: node --test build/build-notifications.test.cjs
    - name: Test module publication
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-ModulePublication.ps1
    - name: Test example help lint
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ExampleHelp.ps1
    - name: Test wildcard lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1WildcardRule.ps1
    - name: Test empty attribute lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1EmptyAttributeRule.ps1
    - name: Test mandatory lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1MandatoryRule.ps1
    - name: Test redundant parameter argument lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ParameterArgumentRule.ps1
    - name: Test explicit parameter position lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ParameterPositionRule.ps1
    - name: Test collection output lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1StandardOutputRule.ps1
    - name: Test parameter layout lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ParameterLayoutRule.ps1
    - name: Test Add-Member lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1AddMemberRule.ps1
    - name: Test access token endpoint lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1AccessTokenRule.ps1
    - name: Test comment-based help lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1CommentRule.ps1
    - name: Test central environment lookup lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1EnvironmentLookupRule.ps1
    - name: Test variable naming lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1VariableNamingRule.ps1
    - name: Test ShouldProcess lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ShouldProcessRule.ps1
    - name: Test declared output type lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1OutputTypeRule.ps1
    - name: Test function interrupt lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1FunctionInterruptRule.ps1
    - name: Test return value lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ReturnValueRule.ps1
    - name: Test object array cast lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ObjectArrayCastRule.ps1
    - name: Test validation attribute on mandatory lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1ValidationAttributeOnMandatoryRule.ps1
    - name: Test wildcard filter lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1WildcardParameterAsFilterRule.ps1
    - name: Test ordered PSCustomObject lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1OrderedPSCustomObjectRule.ps1
    - name: Test Out-Null lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1OutNullRule.ps1
    - name: Test standard Excel export lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1StandardExcelExportRule.ps1
    - name: Test loop append lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1LoopAppendRule.ps1
    - name: Test null comparison lint rules
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1NullComparisonRule.ps1
    - name: Test direct parameter check lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1DirectParameterCheckRule.ps1
    - name: Test pipeline continuation lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1PipelineContinuationRule.ps1
    - name: Test one-parameter-per-line lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1OneParameterPerLineRule.ps1
    - name: Test central API version lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1CentralApiVersionRule.ps1
    - name: Test formatted URL lint rule
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-Ps1FormattedUrlRule.ps1
    - name: Test module prerequisites
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-RequiredModules.ps1
    - name: Restore PowerShell modules
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Test analyzer consolidation
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-PSScriptAnalyzerConsolidation.ps1
    - name: Test Pester runners
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -File ./build/Test-PesterRunners.ps1
