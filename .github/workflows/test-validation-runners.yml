name: test-validation-runners

# Conditional workflow: starts when a registered subject changes, then
# Get-ValidationSuitePlan narrows which PowerShell suites actually run.
# Keep it out of required-check rules: unrelated PRs do not trigger it.
on:
  pull_request:
    paths:
      # Runner / plan (always selects the full suite list)
      - '.github/workflows/test-validation-runners.yml'
      - 'build/Test-ValidationSuites.ps1'
      - 'build/Get-ValidationSuitePlan.ps1'
      - 'build/Test-Ps1RuleSuites.ps1'

      # Lint engine + rule fixtures -> rule / example-help suites
      - 'build/ps1-lint/**'
      - 'build/Test-*.ps1'

      # Publication / build packaging
      - 'build/Publish-ModuleWithRetry.ps1'
      - 'build/vsts-build.ps1'
      - 'build/build-notifications.cjs'
      - 'build/build-notifications.test.cjs'
      - '.github/workflows/build-notifications.yml'
      - '.github/workflows/build-v2.yml'

      # Preload exit-code contract
      - 'd365bap.tools/internal/sdk/token-preload.ps1'
      - 'd365bap.tools/internal/sdk/finopsversion-preload.ps1'

      # Module / tool install contract
      - 'build/Install-RequiredModules.ps1'
      - 'build/Install-Prek.ps1'
      - 'build/ModuleCacheRequirements.json'
      - 'build/ToolCacheRequirements.json'
      - 'build/ci-stubs/**'

      # Pester runner / analyzer consolidation
      - 'd365bap.tools/tests/pester.ps1'
      - 'd365bap.tools/tests/pester-PSScriptAnalyzer.ps1'
      - 'd365bap.tools/tests/general/PSScriptAnalyzer.Tests.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  regression:
    name: Validation runner regression tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        # Check out the PR branch tip so merge-base(base, head) works. The
        # default pull_request ref is a temporary merge commit (github.sha).
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    - name: Test build notifications
      run: node --test build/build-notifications.test.cjs
    - name: Restore PowerShell modules
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-base-v2-
    - name: Ensure prerequisites
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base
    - name: Run validation suites
      shell: pwsh
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or [string]::IsNullOrWhiteSpace($env:HEAD_SHA)) {
          pwsh -NoProfile -NonInteractive -File ./build/Test-ValidationSuites.ps1 -ForceAll
        }
        else {
          pwsh -NoProfile -NonInteractive -File ./build/Test-ValidationSuites.ps1
        }
