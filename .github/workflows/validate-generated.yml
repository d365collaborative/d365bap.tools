name: validate-generated

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  touch-guard:
    name: Deny hand-edited generated files
    runs-on: windows-latest
    # No bypass: generated files are never committed by hand. The regen
    # workflow commits them, and it overwrites anything but generator output.
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for touched generated files
      shell: pwsh
      run: ./build/Test-GeneratedTouch.ps1 -BaseRef origin/${{ github.base_ref }}

  freshness:
    name: Generated artifacts in sync
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Restore Powershell Modules
      uses: actions/cache/restore@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-generated-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}
        restore-keys: |
          pwsh-modules-${{ runner.os }}-generated-v2-

    # Unconditional fallback: a missing or evicted cache makes this slower,
    # never incorrect.
    - name: Ensure Prerequisites
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set generated

    - name: Validate generated artifacts
      shell: pwsh
      run: ./build/vsts-validate-generated.ps1
