# Build and release the d365bap.tools PowerShell module on every push to main.
# Validation jobs run in parallel with module caching; build-and-release runs after all pass.

on:
  push:
    branches:
      - main

jobs:
  general-unit-tests:
    name: Validate General Unit Tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Cache Powershell Modules
      id: cache-powershell-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ps-modules-${{ runner.os }}-v1

    - name: Install Prerequisites
      if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $modules = @('Pester','PSFramework','PSModuleDevelopment','PSScriptAnalyzer','ImportExcel','Az.Accounts')
        foreach ($module in $modules) {
          Write-Host "Installing $module..."
          Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck
        }

    - name: Validate
      shell: powershell
      run: build\vsts-validate-v2.ps1 -TestGeneral $true -TestFunctions $false -Exclude "PSScriptAnalyzer.Tests.ps1"

  public-functions-unit-tests:
    name: Validate Public Functions using PSScriptAnalyzer Unit Tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Cache Powershell Modules
      id: cache-powershell-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ps-modules-${{ runner.os }}-v1

    - name: Install Prerequisites
      if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $modules = @('Pester','PSFramework','PSModuleDevelopment','PSScriptAnalyzer','ImportExcel','Az.Accounts')
        foreach ($module in $modules) {
          Write-Host "Installing $module..."
          Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck
        }

    - name: Validate
      shell: powershell
      run: build\vsts-validate-psscriptanalyzer.ps1 -TestPublic $true -TestInternal $false

  internal-functions-unit-tests:
    name: Validate Internal Functions using PSScriptAnalyzer Unit Tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Cache Powershell Modules
      id: cache-powershell-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ps-modules-${{ runner.os }}-v1

    - name: Install Prerequisites
      if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $modules = @('Pester','PSFramework','PSModuleDevelopment','PSScriptAnalyzer','ImportExcel','Az.Accounts')
        foreach ($module in $modules) {
          Write-Host "Installing $module..."
          Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck
        }

    - name: Validate
      shell: powershell
      run: build\vsts-validate-psscriptanalyzer.ps1 -TestPublic $false -TestInternal $true

  individual-unit-tests:
    name: Validate Individual Unit Tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Cache Powershell Modules
      id: cache-powershell-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ps-modules-${{ runner.os }}-v1

    - name: Install Prerequisites
      if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $modules = @('Pester','PSFramework','PSModuleDevelopment','PSScriptAnalyzer','ImportExcel','Az.Accounts')
        foreach ($module in $modules) {
          Write-Host "Installing $module..."
          Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck
        }

    - name: Validate
      shell: powershell
      run: build\vsts-validate-v2.ps1 -TestGeneral $false -TestFunctions $true

  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    needs: [general-unit-tests, public-functions-unit-tests, internal-functions-unit-tests, individual-unit-tests]
    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 1

    - name: Cache Powershell Modules
      id: cache-powershell-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ps-modules-${{ runner.os }}-v1

    - name: Install Prerequisites
      if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
      run: .\build\vsts-prerequisites.ps1
      shell: powershell

    - name: Build
      run: .\build\vsts-build.ps1 -ApiKey ${{ secrets.APIKEY }} -AutoVersion:$true -SkipPublish:$false
      shell: powershell

    - name: Get version
      shell: powershell
      run: |
        $publishDir = Get-Item -Path publish
        [version]$version = (Import-PowerShellDataFile -Path "$($publishDir.FullName)\d365bap.tools\d365bap.tools.psd1").ModuleVersion
        $githubReleaseVersion = "$($version.Major).$($version.Minor).$($version.Build)"
        "VERSION=$githubReleaseVersion" >> $env:GITHUB_ENV

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ env.VERSION }}
        tag_name: ${{ env.VERSION }}
        draft: false
        prerelease: true
        generate_release_notes: true
