name: Warm Module Cache

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3,6' # Wednesday and Saturday 06:00 UTC
  workflow_dispatch:

jobs:
  warm-cache:
    runs-on: windows-latest
    steps:
    - name: Cache PowerShell modules
      id: cache-powershell-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-v1

    - name: Install modules
      if: steps.cache-powershell-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $modules = @('Pester','PSFramework','PSModuleDevelopment','PSScriptAnalyzer','ImportExcel','Az.Accounts')
        foreach ($module in $modules) {
          Write-Host "Installing $module..."
          Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck
        }

    # The regen generate job (and validate-generated freshness job) need the
    # generator set: base modules plus platyPS. They run on PR refs where the
    # token cannot save, so this trusted main-branch job owns warming their key.
    # PR jobs restore it read-only (actions/cache/restore) and get a hit.
    - name: Cache generated PowerShell modules
      id: cache-generated-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-generated-${{ runner.os }}-v1

    - name: Install generator modules
      if: steps.cache-generated-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        $modules = @('platyPS')
        foreach ($module in $modules) {
          Write-Host "Installing $module..."
          Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck
        }
