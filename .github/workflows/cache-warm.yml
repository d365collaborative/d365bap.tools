name: Warm Module Cache

# Sole cache producer for the PowerShell module sets and the pinned CI tools.
# Every dependency set is warmed here on trusted main-branch runs so PR jobs
# (including pull_request_target regen, whose token cannot save caches) can
# restore them read-only.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3,6' # Wednesday and Saturday 06:00 UTC
  workflow_dispatch:

jobs:
  warm-prek:
    name: Warm pinned prek
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    # Same key and path as the restore step in validate.yml. Install-Prek.ps1
    # verifies the exact pin before and after an install.
    - name: Cache pinned prek
      id: cache-prek
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}\prek
        key: prek-${{ runner.os }}-${{ hashFiles('build/ToolCacheRequirements.json') }}

    - name: Install pinned prek
      if: steps.cache-prek.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build/Install-Prek.ps1 -TargetPath (Join-Path $env:RUNNER_TEMP 'prek')

  warm-lint:
    name: Warm lint module
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache lint PowerShell modules
      id: cache-lint-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-lint-v1-${{ hashFiles('build/ModuleCacheRequirements.json') }}

    - name: Install lint modules
      if: steps.cache-lint-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set lint

  warm-base:
    name: Warm base modules
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache base PowerShell modules
      id: cache-base-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}

    - name: Install base modules
      if: steps.cache-base-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base

  warm-generated:
    name: Warm generator modules
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache generated PowerShell modules
      id: cache-generated-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-generated-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}

    - name: Install generator modules
      if: steps.cache-generated-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set generated
