name: Warm Module Cache

# Sole cache producer. Both dependency sets are warmed here on trusted
# main-branch runs so PR jobs (including pull_request_target regen, whose
# token cannot save caches) can restore them read-only.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3,6' # Wednesday and Saturday 06:00 UTC
  workflow_dispatch:

jobs:
  warm-base:
    name: Warm base modules
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache base PowerShell modules
      id: cache-base-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-base-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}

    - name: Install base modules
      if: steps.cache-base-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set base

  warm-generated:
    name: Warm generator modules
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Cache generated PowerShell modules
      id: cache-generated-modules
      uses: actions/cache@v5
      with:
        path: ~\Documents\PowerShell\Modules
        key: pwsh-modules-${{ runner.os }}-generated-v2-${{ hashFiles('build/ModuleCacheRequirements.json') }}

    - name: Install generator modules
      if: steps.cache-generated-modules.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./build/Install-RequiredModules.ps1 -Set generated
