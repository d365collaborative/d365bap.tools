minimum_prek_version = "0.5.6"
default_install_hook_types = ["pre-commit"]

# PowerShell lint for this repo. The hook scripts under build/ps1-lint are
# vendored from an internal-only module and live their own life here: they
# started as a copy and are maintained in this repo. Do not reference the
# internal module from this public repo.
#
# Local (optional, opt-in):
#   pip install prek
#   prek install
#   prek run setup --stage manual   # one-time: installs the pinned PSScriptAnalyzer
#   prek run                         # changed/staged files
#   prek run --all-files --stage manual   # whole tree
# The formatter and the analyzer import one pinned PSScriptAnalyzer version
# (build/ps1-lint/internal/Ps1AnalyzerSettings.psd1); a newer installed version
# is never used. PRs on GitHub run the same hooks on changed files (see
# .github/workflows/validate.yml) and install only the tools those hooks need.
# CI offers every changed file to the cheap builtin hooks, but installs and runs
# the PowerShell hooks only when a changed script can match them. Full-tree and
# dependency-aware scans stay opt-in; they are not required PR checks.

[[repos]]
repo = "local"

[[repos.hooks]]
id = "setup"
priority = 0
name = "setup (install PSScriptAnalyzer)"
language = "system"
entry = "pwsh"
args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "build/ps1-lint/setup/Run.ps1"]
stages = ["manual"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "ps1-lint"
priority = 10
name = "PowerShell format, UTF-8 BOM, analyzer, and repo rules"
language = "system"
entry = "pwsh"
args = ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "build/ps1-lint/lint/Run.ps1"]
files = { glob = ["**.ps1", "**.psm1", "**.psd1"] }
# Generated unit tests are owned by the regen workflow; linting them would flag
# their template comments on every new command.
exclude = { glob = ["d365bap.tools/tests/functions/*.Tests.ps1"] }
# One process formats and analyzes each batch, so a run pays one process start
# and one PSScriptAnalyzer import instead of one per hook. The hook reads files
# in smaller chunks internally to keep memory flat; 64 keeps the process count
# low without a command line large enough to hit the platform limit.
pass_filenames = 64
stages = ["pre-commit", "manual"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]
stages = ["pre-commit", "manual"]
priority = 30

[[repos.hooks]]
id = "trailing-whitespace"
stages = ["pre-commit", "manual"]
priority = 5
# Generated unit tests come from Invoke-PSMDTemplate and carry template
# whitespace. Their content is owned by the regen workflow (see
# build/vsts-validate-generated.ps1), so whitespace hooks leave them alone.
exclude = { glob = ["d365bap.tools/tests/functions/*.Tests.ps1"] }

[[repos.hooks]]
id = "end-of-file-fixer"
stages = ["pre-commit", "manual"]
priority = 6
# Same ownership as above, plus the consolidated format files written by
# Merge-FormatPs1Xml.ps1 and the wiki namespaces article maintained by
# update-docs.ps1. Freshness checks compare generator output, so
# normalizing these files would fight the generators.
exclude = { glob = ["d365bap.tools/tests/functions/*.Tests.ps1", "d365bap.tools/xml/d365bap.tools.Table.Format.ps1xml", "d365bap.tools/xml/d365bap.tools.List.Format.ps1xml", "wiki/Namespaces.md"] }

[[repos.hooks]]
id = "check-json"
priority = 30
stages = ["pre-commit", "manual"]

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]
priority = 30
stages = ["pre-commit", "manual"]
